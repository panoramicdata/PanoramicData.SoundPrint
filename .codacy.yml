exclude_paths:
  - "**/bin/**"
  - "**/obj/**"
  # EF Core migrations are generated by dotnet ef.
  - "PanoramicData.SoundPrint.Postgres/Migrations/**"
  # Test, test-audio and benchmark projects are tooling, not shipped code. They deliberately use System.Random (seeded, so audio
  # is repeatable; nothing here is cryptographic) and build SQL against throwaway test containers, which pattern-based security
  # rules flag as weak randomness and injection.
  - "PanoramicData.SoundPrint.Test/**"
  - "PanoramicData.SoundPrint.IntegrationTest/**"
  - "PanoramicData.SoundPrint.SyntheticAudio/**"
  - "PanoramicData.SoundPrint.Benchmarks/**"
  # The browser demo's JavaScript is thin browser glue (microphone, canvas), exercised manually.
  - "PanoramicData.SoundPrint.Demo/wwwroot/**"
  # The browser demo is a sample application whose services are exercised by unit tests; its UI is Razor markup and JavaScript.
  - "PanoramicData.SoundPrint.Demo/**"
